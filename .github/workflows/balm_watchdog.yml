name: Balm Watchdog — Missed Edition Recovery

# GitHub's scheduled triggers are best-effort. Observed on this repo: a ~30
# minute baseline delay, one run 3h34m late (which is how a PM run came to
# overwrite that morning's digest), and two triggers dropped outright in a
# single day. This workflow turns a dropped trigger into a late edition rather
# than a lost one, for BOTH editions — the previous version only covered AM,
# which is why 2026-08-06 and 2026-08-26 lost their PM editions silently.
#
# Four checks a day, so a dropped watchdog trigger still leaves a second chance
# inside each edition's window. Deciding what is due is watchdog_check.py's job.

on:
  schedule:
    - cron: '30 13 * * *'  #  6:30am PDT — after the AM run should have landed
    - cron: '0 17 * * *'   # 10:00am PDT — AM second chance
    - cron: '30 23 * * *'  #  4:30pm PDT — after the PM run should have landed
    - cron: '0 3 * * *'    #  8:00pm PDT — PM second chance
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find missing editions
        id: check
        run: python watchdog_check.py

      - name: Recover missing editions
        if: steps.check.outputs.missing != ''
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          # Date and edition are both passed explicitly: the watchdog already
          # decided which edition is missing, and re-deriving either inside the
          # pipeline could pick a different one. pipeline.py's overwrite guard
          # is the backstop if this is ever wrong.
          IFS=',' read -ra ENTRIES <<< "${{ steps.check.outputs.missing }}"
          for entry in "${ENTRIES[@]}"; do
            DATE="${entry%%:*}"
            RUN="${entry##*:}"
            echo "::group::Recovering $DATE $RUN"
            python pipeline.py --run "$RUN" --date "$DATE"
            echo "::endgroup::"
          done

      - name: Commit and push recovered editions
        if: steps.check.outputs.missing != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Watchdog recovery: ${{ steps.check.outputs.missing }}"
          # Rebase-and-retry before pushing. The runner checked out main minutes
          # ago; anything pushed since (a human commit, an overlapping run)
          # makes a plain `git push` a non-fast-forward and the edition is lost
          # even though the pipeline succeeded. Generated files touch only
          # docs/, so replaying this commit on top is safe.
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/$BRANCH and retrying"
            git pull --rebase --autostash origin "$BRANCH" || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
