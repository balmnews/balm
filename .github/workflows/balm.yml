name: Balm Digest

on:
  schedule:
    - cron: '15 11 * * *'   # AM: 4:15am PDT / 5:15am PST (one-hour seasonal drift accepted)
    - cron: '15 21 * * *'   # PM: 2:15pm PDT / 1:15pm PST (one-hour seasonal drift accepted)
  workflow_dispatch:
    inputs:
      run:
        description: 'Edition to generate'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - am
          - pm
      date:
        description: 'Date override (YYYY-MM-DD, leave blank for today)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The edition is resolved inside pipeline.py, from Pacific time. This step
      # only forwards an explicit workflow_dispatch choice; it must never guess
      # from the runner clock, which is UTC. A PM run delayed past 00:00 UTC used
      # to be seen here as hour < 14, forced to "am", and written over that
      # morning's published digest.
      - name: Forward explicit edition override
        id: edition
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run }}" != "auto" ]; then
            echo "run=${{ github.event.inputs.run }}" >> $GITHUB_OUTPUT
          else
            echo "run=" >> $GITHUB_OUTPUT
          fi

      - name: Run Balm pipeline
        id: pipeline
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ steps.edition.outputs.run }}" ]; then
            ARGS="--run ${{ steps.edition.outputs.run }}"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python pipeline.py $ARGS

      # Use the edition pipeline.py resolved, not the runner's UTC clock — those
      # disagreed, which is how a commit came to say "2026-08-27 AM" while
      # overwriting docs/2026-08-26-am.html.
      - name: Determine commit message
        id: commitdate
        run: |
          DATE="${{ steps.pipeline.outputs.resolved_date }}"
          RUN_UPPER=$(echo "${{ steps.pipeline.outputs.resolved_run }}" | tr '[:lower:]' '[:upper:]')
          echo "msg=Balm digest $DATE $RUN_UPPER" >> $GITHUB_OUTPUT

      - name: Commit and push digest files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "${{ steps.commitdate.outputs.msg }}"
          # Rebase-and-retry before pushing. The runner checked out main minutes
          # ago; anything pushed since (a human commit, an overlapping run)
          # makes a plain `git push` a non-fast-forward and the edition is lost
          # even though the pipeline succeeded. Generated files touch only
          # docs/, so replaying this commit on top is safe.
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/$BRANCH and retrying"
            git pull --rebase --autostash origin "$BRANCH" || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
