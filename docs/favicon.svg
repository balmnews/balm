<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');</style>
    <filter id="f" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology operator="dilate" radius="0.4" result="spread"/>
      <feGaussianBlur in="spread" stdDeviation="0.3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="32" height="32" fill="#f2ede4" rx="4"/>
  <text x="16" y="24"
    font-family="Caveat, cursive"
    font-weight="700"
    font-size="24"
    fill="#6b82a8"
    text-anchor="middle"
    filter="url(#f)">B</text>
</svg>
